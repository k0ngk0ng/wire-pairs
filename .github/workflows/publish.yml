name: Test and publish container
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/k0ngk0ng/wire-pairs:latest
            ghcr.io/k0ngk0ng/wire-pairs:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/k0ngk0ng/wire-pairs
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: VITE_ASSET_BASE_URL=https://cdn.ichenj.com/llk/
          cache-from: type=gha
          cache-to: type=gha,mode=max
