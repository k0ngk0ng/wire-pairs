server {
    listen 80;
    listen [::]:80;
    server_name llk.ichenj.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/wire-pairs/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name llk.ichenj.com;

    ssl_certificate /etc/letsencrypt/live/llk.ichenj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llk.ichenj.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 128k;
    access_log /var/log/nginx/llk.access.log;
    error_log /var/log/nginx/llk.error.log;

    location / {
        proxy_pass http://127.0.0.1:18181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
