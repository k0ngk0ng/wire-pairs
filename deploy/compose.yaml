name: wire-pairs
services:
  app:
    image: ghcr.io/k0ngk0ng/wire-pairs:${RELEASE_TAG:-latest}
    ports:
      - "127.0.0.1:18181:3001"
    environment:
      APP_ORIGIN: https://llk.ichenj.com
      COOKIE_SECURE: "true"
      DATA_DIR: /app/data
    volumes:
      - /opt/wire-pairs/data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
